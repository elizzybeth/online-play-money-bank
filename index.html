<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Online Play Money Bank</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="top-bar" aria-label="Application toolbar">
        <a class="brand" href="./" aria-label="Online Play Money Bank home">
          <span class="brand-badge" aria-hidden="true">$</span>
          <span>Online Play Money Bank</span>
        </a>

        <div class="top-actions">
          <label class="currency-label" for="currency">Currency</label>
          <select id="currency" class="currency-select" aria-label="Choose currency">
            <option value="USD">USD $</option>
            <option value="EUR">EUR €</option>
            <option value="GBP">GBP £</option>
            <option value="JPY">JPY ¥</option>
            <option value="CAD">CAD C$</option>
            <option value="AUD">AUD A$</option>
          </select>
          <button class="icon-button" type="button" aria-label="Settings coming soon" title="Settings coming soon">
            <span aria-hidden="true">⚙</span>
          </button>
        </div>
      </header>

      <main class="main-stage">
        <section class="register-zone" aria-labelledby="display-label">
          <div class="cash-register" id="register">
            <div class="register-top">
              <div class="receipt-slot" aria-hidden="true"></div>
              <div class="display-housing">
                <p id="display-label" class="display-label">Pretend Rich Mode</p>
                <output id="balance-display" class="lcd-display" for="amount currency">$0</output>
              </div>
            </div>

            <div class="button-bank" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span>
            </div>

            <div class="drawer-window" aria-label="Cash drawer">
              <div class="drawer-back">
                <span class="empty-note">empty!</span>
              </div>
              <div class="money-scene" id="money-scene" aria-hidden="true"></div>
              <div class="drawer-lip">
                <span class="drawer-handle"></span>
              </div>
            </div>
            <div class="wealth-effects" id="wealth-effects" aria-hidden="true"></div>
          </div>
        </section>

        <aside class="control-panel" aria-label="Balance controls">
          <div class="amount-row">
            <label for="amount">Set your pretend balance</label>
            <div class="amount-input-wrap">
              <span class="amount-symbol" id="amount-symbol" aria-hidden="true">$</span>
              <input
                id="amount"
                type="text"
                min="0"
                max="1000000000000000"
                inputmode="decimal"
                aria-describedby="amount-help"
              />
            </div>
            <p id="amount-help">Type any amount from 0.01 to 1,000,000,000,000,000.</p>
          </div>

          <div class="preset-grid" aria-label="Quick amounts">
            <button type="button" data-amount="100">100</button>
            <button type="button" data-amount="1000">1,000</button>
            <button type="button" data-amount="10000">10,000</button>
            <button type="button" data-amount="100000">100,000</button>
            <button type="button" data-amount="1000000">1,000,000</button>
            <button type="button" data-amount="1000000000">1,000,000,000</button>
            <button type="button" data-amount="1000000000000">1,000,000,000,000</button>
            <button type="button" data-amount="1000000000000000">1,000,000,000,000,000</button>
          </div>

          <button class="clear-button" type="button" id="clear-register">Clear Register</button>
          <p class="tagline" id="wealth-caption" aria-live="polite">
            <span id="wealth-flavor"></span>
            <span id="buy-examples"></span>
            <span id="wealth-count"></span>
          </p>
        </aside>
      </main>

      <footer class="footer">
        Play money only. Sadly, capitalism remains undefeated.
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
